[package]
name = "tree-sitter-mojo"
description = "Mojo grammar for tree-sitter"
version = "0.3.0"
license = "Apache-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "mojo"]
categories = ["parser-implementations", "text-editors"]
repository = "https://github.com/forfudan/tree-sitter-mojo"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25"
streaming-iterator = "0.1"
